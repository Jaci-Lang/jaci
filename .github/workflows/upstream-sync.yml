name: Upstream Sync

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream branch to sync from'
        required: true
        default: 'master'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    name: Sync with upstream Luau
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream changes
        id: fetch-upstream
        run: |
          UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch || 'master' }}"
          git remote add upstream https://github.com/luau-lang/luau.git || git remote set-url upstream https://github.com/luau-lang/luau.git
          git fetch upstream "$UPSTREAM_BRANCH"

          # Check for new commits from upstream compared to current HEAD
          COMMITS_COUNT=$(git rev-list --count HEAD..upstream/"$UPSTREAM_BRANCH")
          echo "commits_count=$COMMITS_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COMMITS_COUNT new commit(s) from upstream/$UPSTREAM_BRANCH."

      - name: Create sync branch and Open Pull Request
        if: steps.fetch-upstream.outputs.commits_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'master' }}
        run: |
          SYNC_BRANCH="upstream-sync"
          DATE_STR=$(date +'%Y-%m-%d')
          PR_TITLE="[Upstream Sync] Weekly sync with Luau ($DATE_STR)"

          # Prepare sync branch
          git checkout -B "$SYNC_BRANCH" origin/master

          # Generate changelog of incoming commits
          COMMIT_LOG=$(git log --no-merges --pretty=format:"- %h %s (%an)" HEAD..upstream/"$UPSTREAM_BRANCH" | head -n 50)

          # Attempt merge from upstream
          if ! git merge --no-edit upstream/"$UPSTREAM_BRANCH"; then
            echo "Merge encountered conflicts. Adding conflicted state for manual resolution in PR."
            git add -A
            git commit -m "Merge upstream/$UPSTREAM_BRANCH into $SYNC_BRANCH (with conflicts to resolve)" || true
          fi

          # Push sync branch
          git push -u origin "$SYNC_BRANCH" --force

          # Generate PR description file
          cat << 'EOF' > pr_body.md
          ## Upstream Luau Sync (${DATE_STR})

          This automated pull request synchronizes changes from [`luau-lang/luau`](https://github.com/luau-lang/luau) (branch: `${UPSTREAM_BRANCH}`).

          ### Notice for Maintainers
          > **Jaci** is a general-purpose Luau fork optimized for use outside Roblox Studio.
          > Please review and validate these upstream changes to ensure they align with Jaci's standalone and general-purpose goals before merging.

          ### Incoming Commits
          EOF
          # Re-evaluate variables for body
          cat << EOF > pr_body.md
          ## Upstream Luau Sync ($DATE_STR)

          This automated pull request synchronizes changes from [\`luau-lang/luau\`](https://github.com/luau-lang/luau) (branch: \`$UPSTREAM_BRANCH\`).

          ### Notice for Maintainers
          > **Jaci** is a general-purpose Luau fork optimized for use outside Roblox Studio.
          > Please review and validate these upstream changes to ensure they align with Jaci's standalone and general-purpose goals before merging.

          ### Incoming Commits
          $COMMIT_LOG

          ---
          *Triggered automatically by the Upstream Sync workflow.*
          EOF

          # Check if an existing open PR for this branch already exists
          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --base master --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body-file pr_body.md
          else
            echo "Creating new pull request"
            gh pr create --title "$PR_TITLE" --body-file pr_body.md --head "$SYNC_BRANCH" --base master
          fi
