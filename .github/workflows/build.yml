name: build

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'docs/**'
      - 'papers/**'
      - 'rfcs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'papers/**'
      - 'rfcs/**'
      - '*.md'

jobs:
  unix:
    strategy:
      matrix:
        os: [{name: ubuntu, version: ubuntu-latest}, {name: macos, version: macos-latest}, {name: macos-arm, version: macos-14}]
        compiler:
          - name: Clang
            cc: clang
            cxx: clang++
          - name: GCC
            cc: gcc
            cxx: g++
    name: ${{matrix.os.name}} with ${{matrix.compiler.name}}
    runs-on: ${{matrix.os.version}}
    steps:
    - uses: actions/checkout@v4

    - name: Setup Compiler Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os.name }}-${{ matrix.compiler.name }}

    - name: Install LLVM Dependencies
      if: matrix.os.name == 'ubuntu'
      run: |
        sudo sysctl -w vm.mmap_rnd_bits=28 || true
        sudo apt-get update -qq
        sudo apt-get install -y llvm clang

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_C_COMPILER=${{matrix.compiler.cc}} \
          -DCMAKE_CXX_COMPILER=${{matrix.compiler.cxx}} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DLUAU_WERROR=ON

    - name: Build Targets
      run: cmake --build build --target Luau.UnitTest Luau.Conformance luau luau-analyze luau-compile -j $(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run Unit Tests
      run: |
        ./build/Luau.UnitTest
        ./build/Luau.UnitTest --fflags=true
        ./build/Luau.UnitTest --fflags=DebugLuauForceOldSolver

    - name: Run Conformance Tests
      run: |
        ./build/Luau.Conformance
        ./build/Luau.Conformance --codegen
        ./build/Luau.Conformance --codegen -O2
        ./build/Luau.Conformance --codegen -O2 --fflags=true

    - name: Run CLI Sanity Checks
      run: |
        ./build/luau tests/conformance/assert.luau
        ./build/luau-analyze tests/conformance/assert.luau
        ./build/luau-compile tests/conformance/assert.luau

  windows:
    runs-on: windows-latest
    name: Windows x64 (Fast Ninja + sccache)
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Compiler Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: windows-msvc-ninja
        variant: sccache

    - name: Configure CMake (Ninja)
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_C_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_FLAGS="/MP /Gy /Gw /O2" `
          -DLUAU_WERROR=ON

    - name: Build Targets (Fast Parallel)
      run: cmake --build build --target Luau.UnitTest Luau.Conformance luau luau-analyze luau-compile -j 4

    - name: Run Unit Tests
      shell: bash
      run: |
        build/Luau.UnitTest.exe
        build/Luau.UnitTest.exe --fflags=true

    - name: Run Conformance Tests
      shell: bash
      run: |
        build/Luau.Conformance.exe
        build/Luau.Conformance.exe --codegen
        build/Luau.Conformance.exe --codegen -O2

    - name: Run CLI Sanity Checks
      shell: bash
      run: |
        build/luau.exe tests/conformance/assert.luau
        build/luau-analyze.exe tests/conformance/assert.luau
        build/luau-compile.exe tests/conformance/assert.luau
