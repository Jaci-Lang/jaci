name: build

env:
  LLVM_VERSION: "19.1.7"

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'docs/**'
      - 'papers/**'
      - 'rfcs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'papers/**'
      - 'rfcs/**'
      - '*.md'

jobs:
  unix:
    strategy:
      matrix:
        os: [{name: ubuntu, version: ubuntu-latest}, {name: macos, version: macos-latest}, {name: macos-arm, version: macos-14}]
        compiler:
          - name: Clang
            cc: clang
            cxx: clang++
          - name: GCC
            cc: gcc
            cxx: g++
    name: ${{matrix.os.name}} with ${{matrix.compiler.name}}
    runs-on: ${{matrix.os.version}}
    steps:
    - uses: actions/checkout@v4

    - name: Restore LLVM toolchain
      id: llvm-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}
        key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install LLVM toolchain
      uses: KyleMayes/install-llvm-action@v2.0.9
      with:
        version: ${{ env.LLVM_VERSION }}
        directory: ${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}
        cached: ${{ steps.llvm-cache.outputs.cache-hit }}
        env: false

    - name: Setup Compiler Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os.name }}-${{ matrix.compiler.name }}

    - name: Tune Linux memory mapping
      if: matrix.os.name == 'ubuntu'
      run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_C_COMPILER=${{matrix.compiler.cc}} \
          -DCMAKE_CXX_COMPILER=${{matrix.compiler.cxx}} \
          -DLLVM_DIR="${LLVM_PATH}/lib/cmake/llvm" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DLUAU_WERROR=ON

    - name: Build Targets
      run: cmake --build build --target Luau.UnitTest Luau.Conformance Luau.Repl.CLI Luau.Analyze.CLI Luau.Compile.CLI -j $(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run Unit Tests
      run: |
        ./build/Luau.UnitTest
        ./build/Luau.UnitTest --fflags=true
        ./build/Luau.UnitTest --fflags=DebugLuauForceOldSolver

    - name: Run Conformance Tests
      run: |
        ./build/Luau.Conformance
        ./build/Luau.Conformance --codegen
        ./build/Luau.Conformance --codegen -O2
        ./build/Luau.Conformance --codegen -O2 --fflags=true

    - name: Run CLI Sanity Checks
      run: |
        ./build/luau tests/conformance/assert.luau
        ./build/luau-analyze tests/conformance/assert.luau
        ./build/luau-compile tests/conformance/assert.luau

  windows:
    runs-on: windows-latest
    name: Windows x64 (Fast Ninja + sccache)
    steps:
    - uses: actions/checkout@v4

    - name: Restore LLVM development toolchain
      id: llvm-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}
        key: llvm-dev-v2-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install LLVM development toolchain
      if: steps.llvm-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $destination = "${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}"
        $archive = "${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}.tar.xz"
        New-Item -ItemType Directory -Force -Path $destination | Out-Null
        curl.exe --fail --location "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.tar.xz" --output $archive
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        tar.exe -xf $archive -C $destination --strip-components=1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item -Force $archive

    - name: Export LLVM environment
      shell: pwsh
      run: |
        $llvmPath = "${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}"
        if (-not (Test-Path "$llvmPath/lib/cmake/llvm/LLVMConfig.cmake")) {
          throw "LLVMConfig.cmake is missing from $llvmPath"
        }
        "LLVM_PATH=$llvmPath" >> $env:GITHUB_ENV
        "$llvmPath/bin" >> $env:GITHUB_PATH

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Compiler Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: windows-msvc-ninja
        variant: sccache

    - name: Configure CMake (Ninja)
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_C_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
          -DLLVM_DIR="$env:LLVM_PATH/lib/cmake/llvm" `
          -DCMAKE_CXX_FLAGS="/MP /Gy /Gw /O2" `
          -DLUAU_WERROR=ON

    - name: Build Targets (Fast Parallel)
      run: cmake --build build --target Luau.UnitTest Luau.Conformance Luau.Repl.CLI Luau.Analyze.CLI Luau.Compile.CLI -j 4

    - name: Run Unit Tests
      shell: bash
      run: |
        build/Luau.UnitTest.exe
        build/Luau.UnitTest.exe --fflags=true

    - name: Run Conformance Tests
      shell: bash
      run: |
        build/Luau.Conformance.exe
        build/Luau.Conformance.exe --codegen
        build/Luau.Conformance.exe --codegen -O2

    - name: Run CLI Sanity Checks
      shell: bash
      run: |
        build/luau.exe tests/conformance/assert.luau
        build/luau-analyze.exe tests/conformance/assert.luau
        build/luau-compile.exe tests/conformance/assert.luau
