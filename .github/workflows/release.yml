name: release

env:
  LLVM_VERSION: "19.1.7"

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'docs/**'
      - 'papers/**'
      - 'rfcs/**'
      - '*.md'

jobs:
  build:
    strategy:
      matrix:
        os: [{name: ubuntu, version: ubuntu-22.04}, {name: macos, version: macos-latest}, {name: windows, version: windows-latest}]
    name: build-${{matrix.os.name}}
    runs-on: ${{matrix.os.version}}
    steps:
    - uses: actions/checkout@v4

    - name: Restore LLVM toolchain
      id: llvm-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}
        key: llvm-dev-v2-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install LLVM toolchain
      if: matrix.os.name != 'windows'
      uses: KyleMayes/install-llvm-action@v2.0.9
      with:
        version: ${{ env.LLVM_VERSION }}
        directory: ${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}
        cached: ${{ steps.llvm-cache.outputs.cache-hit }}
        env: false

    - name: Install LLVM development toolchain (Windows)
      if: matrix.os.name == 'windows' && steps.llvm-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $destination = "${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}"
        $archive = "${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}.tar.xz"
        New-Item -ItemType Directory -Force -Path $destination | Out-Null
        curl.exe --fail --location "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.tar.xz" --output $archive
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        tar.exe -xf $archive -C $destination --strip-components=1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item -Force $archive

    - name: Export LLVM environment (Windows)
      if: matrix.os.name == 'windows'
      shell: pwsh
      run: |
        $llvmPath = "${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}"
        if (-not (Test-Path "$llvmPath/lib/cmake/llvm/LLVMConfig.cmake")) {
          throw "LLVMConfig.cmake is missing from $llvmPath"
        }
        "LLVM_PATH=$llvmPath" >> $env:GITHUB_ENV
        "$llvmPath/bin" >> $env:GITHUB_PATH

    - name: Setup Compiler Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: release-${{ matrix.os.name }}
        variant: ${{ matrix.os.name == 'windows' && 'sccache' || 'ccache' }}

    - name: Setup MSVC (Windows)
      if: matrix.os.name == 'windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install LLVM dependencies (Windows)
      if: matrix.os.name == 'windows'
      shell: pwsh
      run: |
        $vcpkg = (Get-Command vcpkg.exe).Source
        & $vcpkg install libxml2:x64-windows
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "JACI_VCPKG_ROOT=$(Split-Path $vcpkg)" >> $env:GITHUB_ENV

    - name: Configure CMake (Unix)
      if: matrix.os.name != 'windows'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR="${LLVM_PATH}/lib/cmake/llvm" \
          -DLUAU_STRIP_BINARIES=ON \
          -DLUAU_ENABLE_LTO=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Configure CMake (Windows)
      if: matrix.os.name == 'windows'
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DCMAKE_TOOLCHAIN_FILE="$env:JACI_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DLLVM_DIR="$env:LLVM_PATH/lib/cmake/llvm" `
          -DLUAU_STRIP_BINARIES=ON `
          -DLUAU_ENABLE_LTO=ON `
          -DCMAKE_C_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_FLAGS="/MP /Gy /Gw /O2 /GL" `
          -DCMAKE_EXE_LINKER_FLAGS="/LTCG /OPT:REF /OPT:ICF"

    - name: Build Binaries
      run: cmake --build build --target Luau.Repl.CLI Luau.Analyze.CLI Luau.Compile.CLI Luau.Ast.CLI -j 4

    - name: Strip & Package Release (Unix)
      if: matrix.os.name != 'windows'
      run: |
        cd build
        if [ "${{ matrix.os.name }}" = "macos" ]; then
          strip -u -r luau luau-analyze luau-compile luau-ast || true
        else
          strip -s luau luau-analyze luau-compile luau-ast || true
        fi
        zip -j -9 ../luau-${{ matrix.os.name }}.zip luau luau-analyze luau-compile luau-ast

    - name: Package Release (Windows)
      if: matrix.os.name == 'windows'
      run: |
        7z a -mx=9 luau-${{ matrix.os.name }}.zip .\build\luau.exe .\build\luau-analyze.exe .\build\luau-compile.exe .\build\luau-ast.exe

    - uses: actions/upload-artifact@v4
      with:
        name: luau-${{ matrix.os.name }}
        path: luau-${{ matrix.os.name }}.zip
        overwrite: true

  web:
    name: build-web
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      with:
        repository: emscripten-core/emsdk
        path: emsdk

    - name: Setup Compiler Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: release-web

    - name: Setup Emscripten
      run: |
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest

    - name: Build Web Target
      run: |
        source emsdk/emsdk_env.sh
        emcmake cmake -B build -G Ninja -DLUAU_BUILD_WEB=ON -DLUAU_USE_LLVM=OFF -DCMAKE_BUILD_TYPE=Release -DLUAU_STRIP_BINARIES=ON -DLUAU_ENABLE_LTO=ON
        cmake --build build --target Luau.Web -j 4

    - uses: actions/upload-artifact@v4
      with:
        name: Luau.Web.js
        path: build/Luau.Web.js
        overwrite: true
